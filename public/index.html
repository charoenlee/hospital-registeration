<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Patient Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <span class="header-icon">🏥</span>
      <h1>Hospital Patient Registration</h1>
    </div>
  </header>

  <main>

    <!-- ── Registration Form ─────────────────────────────────────── -->
    <section class="card" id="form-section">
      <h2>Register New Patient</h2>

      <form id="registration-form" novalidate>
        <div class="form-grid">

          <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="e.g. Jane Doe" required />
          </div>

          <div class="field">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required />
          </div>

          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" required>
              <option value="">— select —</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Non-binary">Non-binary</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>

          <div class="field">
            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" placeholder="e.g. 555-0100" required />
          </div>

          <div class="field">
            <label for="blood_type">Blood Type</label>
            <select id="blood_type" required>
              <option value="">— select —</option>
              <option value="A+">A+</option>
              <option value="A-">A−</option>
              <option value="B+">B+</option>
              <option value="B-">B−</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB−</option>
              <option value="O+">O+</option>
              <option value="O-">O−</option>
              <option value="Unknown">Unknown</option>
            </select>
          </div>

        </div><!-- /.form-grid -->

        <div id="form-error" class="alert alert-error hidden"></div>
        <div id="form-success" class="alert alert-success hidden"></div>

        <button type="submit" class="btn btn-primary">Register Patient</button>
      </form>
    </section>

    <!-- ── Patient List ──────────────────────────────────────────── -->
    <section class="card" id="list-section">
      <div class="section-header">
        <h2>All Patients</h2>
        <button class="btn btn-secondary" id="refresh-btn">Refresh</button>
      </div>

      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Search by name, gender, or blood type…" />
        <span id="search-count" class="search-count hidden"></span>
      </div>

      <div id="patient-list-container">
        <p class="loading">Loading patients…</p>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
